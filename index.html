<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EcoAjedrez 3D & AR - Gamer Prototype</title>
  <style>
    :root {
      --bg-panel: rgba(15, 23, 42, 0.85);
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.4);
      --text: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', system-ui, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #090d16; color: var(--text); }
    
    /* Video de fondo para modo AR Fallback */
    #ar-video {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 1; display: none;
    }
    #canvas-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
    }

    /* HUD Gamer Superior */
    .hud-top {
      position: fixed; top: 12px; left: 12px; right: 12px; z-index: 10;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      pointer-events: none;
    }
    .hud-card {
      background: var(--bg-panel); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
      padding: 10px 16px; pointer-events: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .title-gamer {
      font-weight: 800; font-size: 1.1rem; letter-spacing: 1px;
      background: linear-gradient(90deg, #34d399, #3b82f6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .status-badge {
      font-size: 0.85rem; color: #cbd5e1; margin-top: 4px;
    }

    /* Panel Lateral de Configuración */
    .hud-sidebar {
      position: fixed; top: 90px; left: 12px; z-index: 10;
      width: 270px; max-height: calc(100vh - 180px); overflow-y: auto;
      display: flex; flex-direction: column; gap: 10px;
    }
    .control-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
    .control-group label { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; font-weight: 700; }
    select, input[type="text"], button {
      background: rgba(30, 41, 59, 0.9); color: #fff;
      border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
      padding: 8px 10px; font-size: 0.85rem; outline: none; transition: 0.2s;
    }
    select:focus, input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
    
    .btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none; font-weight: 700; cursor: pointer; text-align: center;
    }
    .btn-primary:hover { filter: brightness(1.15); transform: translateY(-1px); }
    .btn-ar {
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      border: none; font-weight: 700; cursor: pointer;
    }
    .color-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
    input[type="color"] {
      width: 48%; height: 32px; border: none; border-radius: 6px; cursor: pointer; background: transparent;
    }

    /* Barra Inferior de Comando por Teclado */
    .hud-bottom {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; gap: 8px; align-items: center;
      width: min(95%, 500px);
    }
    .hud-bottom input { flex: 1; }

    @media (max-width: 640px) {
      .hud-sidebar { width: 210px; font-size: 0.8rem; }
    }
  </style>

  <!-- Librería de Reglas Oficiales de Ajedrez (Chess.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <!-- Three.js + Controles + GLTFLoader para cargar tus modelos de Ecoajedres-AR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <!-- Video para Cámara de Realidad Aumentada -->
  <video id="ar-video" autoplay playsinline muted></video>
  
  <!-- Contenedor 3D -->
  <div id="canvas-container"></div>

  <!-- HUD Superior -->
  <div class="hud-top">
    <div class="hud-card">
      <div class="title-gamer" id="ui-title">ECOAJEDREZ 3D AR</div>
      <div class="status-badge" id="ui-status">Turno: Blancas | Selecciona una ficha</div>
    </div>
    <div class="hud-card" style="display:flex; gap:8px; align-items:center;">
      <select id="lang-select" aria-label="Idioma">
        <option value="es">🇪🇸 Español</option>
        <option value="en">🇺🇸 English</option>
        <option value="zh">🇨🇳 中文 (Mandarín)</option>
      </select>
      <button class="btn-ar" id="btn-toggle-ar">📷 Modo AR</button>
    </div>
  </div>

  <!-- Panel de Configuración Gamer -->
  <div class="hud-sidebar hud-card">
    <div class="control-group">
      <label id="lbl-mode">Modo de Juego</label>
      <select id="game-mode">
        <option value="ai">🤖 Vs Computadora (IA)</option>
        <option value="pvp">⚔️ Versus (2 Jugadores)</option>
      </select>
    </div>

    <div class="control-group" id="ai-level-group">
      <label id="lbl-rank">Rango FIDE (Dificultad)</label>
      <select id="ai-rank">
        <option value="1">🌱 Principiante (600 ELO)</option>
        <option value="2" selected>🛡️ Intermedio (1200 ELO)</option>
        <option value="3">⚔️ Avanzado (1800 ELO)</option>
        <option value="4">👑 Maestro FIDE (2300 ELO)</option>
        <option value="5">🔥 Gran Maestro (2800 ELO)</option>
      </select>
    </div>

    <div class="control-group">
      <label id="lbl-biome">Bioma del Tablero</label>
      <select id="board-biome">
        <option value="classic">🏁 Clásico (Blanco y Negro)</option>
        <option value="jungle">🌿 Selva Mágica (Pasto Rojo/Blanco)</option>
      </select>
    </div>

    <div class="control-group">
      <label id="lbl-style">Estilo de Piezas</label>
      <select id="piece-style">
        <option value="classic">♟️ Clásico 3D Torneado</option>
        <option value="wizard">🧙‍♂️ Magos / Fantasía (Harry Potter)</option>
      </select>
    </div>

    <div class="control-group">
      <label id="lbl-colors">Colores Gamer (Bando 1 / Bando 2)</label>
      <div class="color-row">
        <input type="color" id="color-white" value="#f8fafc" title="Color Jugador 1" />
        <input type="color" id="color-black" value="#1e293b" title="Color Jugador 2" />
      </div>
    </div>

    <button class="btn-primary" id="btn-reset">🔄 Nueva Partida</button>
  </div>

  <!-- HUD Inferior: Entrada por Teclado -->
  <div class="hud-bottom hud-card">
    <input type="text" id="keyboard-move" placeholder="Teclado: ej. e2e4 o g1f3 + Enter" />
    <button class="btn-primary" id="btn-move-key">Mover</button>
  </div>

  <script>
    /**************************************************************
     * 1. INTERNACIONALIZACIÓN (Español, Inglés, Chino Mandarín)
     **************************************************************/
    const I18N = {
      es: {
        title: "ECOAJEDREZ 3D AR",
        turnW: "Turno: Blancas",
        turnB: "Turno: Negras",
        check: " ¡JAQUE!",
        checkmate: "🏆 ¡JAQUE MATE!",
        draw: "🤝 ¡EMPATE!",
        mode: "Modo de Juego",
        rank: "Rango FIDE (Dificultad)",
        biome: "Bioma del Tablero",
        style: "Estilo de Piezas",
        colors: "Colores Gamer (Bando 1 / 2)",
        reset: "🔄 Nueva Partida",
        arBtn: "📷 Modo AR",
        keyPlaceholder: "Teclado: ej. e2e4 o g1f3 + Enter",
        moveBtn: "Mover"
      },
      en: {
        title: "ECOCHESS 3D AR",
        turnW: "Turn: White",
        turnB: "Turn: Black",
        check: " CHECK!",
        checkmate: "🏆 CHECKMATE!",
        draw: "🤝 DRAW!",
        mode: "Game Mode",
        rank: "FIDE Rank (Difficulty)",
        biome: "Board Biome",
        style: "Piece Style",
        colors: "Gamer Colors (Side 1 / 2)",
        reset: "🔄 New Game",
        arBtn: "📷 AR Mode",
        keyPlaceholder: "Keyboard: e.g. e2e4 or g1f3 + Enter",
        moveBtn: "Move"
      },
      zh: {
        title: "生态国际象棋 3D AR",
        turnW: "回合：白方",
        turnB: "回合：黑方",
        check: " 将军！",
        checkmate: "🏆 将死！比赛结束",
        draw: "🤝 平局！",
        mode: "游戏模式",
        rank: "棋手等级 (难度)",
        biome: "棋盘生态主题",
        style: "棋子风格",
        colors: "自定义颜色 (白 / 黑)",
        reset: "🔄 重新开始",
        arBtn: "📷 增强现实 (AR)",
        keyPlaceholder: "键盘输入: 例如 e2e4 + 回车",
        moveBtn: "移动"
      }
    };
    let currentLang = 'es';

    /**************************************************************
     * 2. MOTOR DE REGLAS Y ESCENA THREE.JS
     **************************************************************/
    const game = new Chess();
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 11, 11);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;

    // Iluminación Gamer
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
    dirLight.position.set(8, 18, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    // Grupos 3D
    const boardGroup = new THREE.Group();
    const piecesGroup = new THREE.Group();
    const highlightsGroup = new THREE.Group();
    const grassBlades = []; // Para animar la selva
    scene.add(boardGroup);
    scene.add(piecesGroup);
    scene.add(highlightsGroup);

    // Materiales personalizables para las fichas
    const whiteMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.25, metalness: 0.2 });
    const blackMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.25, metalness: 0.35 });

    // Coordenadas de tablero a mundo 3D
    function algebraicToWorld(square) {
      const file = square.charCodeAt(0) - 97; // 'a' -> 0
      const rank = 8 - parseInt(square[1], 10); // '8' -> 0
      return { x: file - 3.5, z: rank - 3.5, file, rank };
    }

    function worldToAlgebraic(file, rank) {
      return String.fromCharCode(97 + file) + (8 - rank);
    }

    /**************************************************************
     * 3. CONSTRUCCIÓN DE TABLEROS (CLÁSICO VS SELVA ANIMADA)
     **************************************************************/
    function buildBoard(biome = 'classic') {
      while (boardGroup.children.length > 0) boardGroup.remove(boardGroup.children[0]);
      grassBlades.length = 0;

      // Marco base del tablero
      const frameGeo = new THREE.BoxGeometry(9, 0.4, 9);
      const frameMat = new THREE.MeshStandardMaterial({
        color: biome === 'jungle' ? 0x2d4c1e : 0x111827,
        roughness: 0.6
      });
      const frame = new THREE.Mesh(frameGeo, frameMat);
      frame.position.y = -0.25;
      frame.receiveShadow = true;
      boardGroup.add(frame);

      for (let r = 0; r < 8; r++) {
        for (let f = 0; f < 8; f++) {
          const isLight = (r + f) % 2 === 0;
          const squareName = worldToAlgebraic(f, r);
          let tileColor = isLight ? 0xe2e8f0 : 0x334155;
          if (biome === 'jungle') {
            // Pasto blanco lunar vs Pasto rojo carmesí como pediste
            tileColor = isLight ? 0xfafafa : 0xb91c1c;
          }

          const tileGeo = new THREE.BoxGeometry(1, 0.15, 1);
          const tileMat = new THREE.MeshStandardMaterial({
            color: tileColor,
            roughness: biome === 'jungle' ? 0.85 : 0.2,
            metalness: biome === 'jungle' ? 0.05 : 0.2
          });
          const tile = new THREE.Mesh(tileGeo, tileMat);
          tile.position.set(f - 3.5, 0, r - 3.5);
          tile.receiveShadow = true;
          tile.userData = { square: squareName, isTile: true };
          boardGroup.add(tile);

          // Si es modo selva, agregamos briznas de pasto 3D animadas
          if (biome === 'jungle') {
            const bladeGeo = new THREE.ConeGeometry(0.06, 0.28, 4);
            const bladeMat = new THREE.MeshStandardMaterial({ color: tileColor });
            for (let i = 0; i < 4; i++) {
              const blade = new THREE.Mesh(bladeGeo, bladeMat);
              blade.position.set(
                (f - 3.5) + (Math.random() - 0.5) * 0.7,
                0.18,
                (r - 3.5) + (Math.random() - 0.5) * 0.7
              );
              blade.userData = { phase: Math.random() * Math.PI * 2 };
              boardGroup.add(blade);
              grassBlades.push(blade);
            }
          }
        }
      }
    }

    /**************************************************************
     * 4. GENERADOR DE PIEZAS 3D (CLÁSICAS Y ESTILO MAGOS/HARRY POTTER)
     * Nota: También preparado para cargar .GLB de tu repo Ecoajedres-AR
     **************************************************************/
    function createPieceMesh(type, color, style = 'classic') {
      const group = new THREE.Group();
      const mat = color === 'w' ? whiteMat : blackMat;

      // Base común de toda ficha
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 0.15, 20), mat);
      base.position.y = 0.08;
      base.castShadow = true;
      group.add(base);

      if (style === 'wizard') {
        // Modo Mágico (Personajes con túnica, sombrero/corona y arma mágica)
        const robe = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.75, 12), mat);
        robe.position.y = 0.45;
        robe.castShadow = true;
        group.add(robe);

        const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 16), mat);
        head.position.y = 0.9;
        group.add(head);

        // Aura mágica flotante según rango de la pieza
        const auraColor = color === 'w' ? 0x38bdf8 : 0xf43f5e;
        const staffMat = new THREE.MeshStandardMaterial({ color: auraColor, emissive: auraColor, emissiveIntensity: 0.6 });

        if (type === 'k' || type === 'q') {
          const crown = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.35, 6), staffMat);
          crown.position.y = 1.15;
          group.add(crown);
        } else if (type === 'b') {
          // Sombrero de hechicero
          const hat = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.45, 12), staffMat);
          hat.position.y = 1.15;
          group.add(hat);
        } else if (type === 'n') {
          // Lanza de caballero mágico
          const lance = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.1), staffMat);
          lance.position.set(0.25, 0.65, 0);
          group.add(lance);
        } else if (type === 'r') {
          // Escudo Golem
          const shield = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.12), staffMat);
          shield.position.set(0, 0.55, 0.25);
          group.add(shield);
        } else {
          // Espada de guardián para peones
          const sword = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.55, 0.08), staffMat);
          sword.position.set(0.22, 0.55, 0.15);
          group.add(sword);
        }
      } else {
        // Modo Clásico Staunton 3D
        const bodyH = { p: 0.45, r: 0.6, n: 0.65, b: 0.75, q: 0.9, k: 1.05 }[type];
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.28, bodyH, 20), mat);
        body.position.y = 0.15 + bodyH / 2;
        body.castShadow = true;
        group.add(body);

        if (type === 'p') {
          const top = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), mat);
          top.position.y = 0.15 + bodyH + 0.12;
          group.add(top);
        } else if (type === 'r') {
          const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.22, 0.22, 8), mat);
          tower.position.y = 0.15 + bodyH + 0.1;
          group.add(tower);
        } else if (type === 'n') {
          const snout = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.35, 0.42), mat);
          snout.position.set(0, 0.15 + bodyH + 0.1, 0.08);
          group.add(snout);
        } else if (type === 'b') {
          const mitre = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.38, 16), mat);
          mitre.position.y = 0.15 + bodyH + 0.18;
          group.add(mitre);
        } else if (type === 'q') {
          const orb = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 16), mat);
          orb.position.y = 0.15 + bodyH + 0.15;
          group.add(orb);
        } else if (type === 'k') {
          const crossV = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.28, 0.08), mat);
          const crossH = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.08, 0.08), mat);
          crossV.position.y = 0.15 + bodyH + 0.22;
          crossH.position.y = 0.15 + bodyH + 0.22;
          group.add(crossV, crossH);
        }
      }

      return group;
    }

    function renderPieces() {
      while (piecesGroup.children.length > 0) piecesGroup.remove(piecesGroup.children[0]);
      const style = document.getElementById('piece-style').value;
      const board = game.board();

      for (let r = 0; r < 8; r++) {
        for (let f = 0; f < 8; f++) {
          const piece = board[r][f];
          if (piece) {
            const square = worldToAlgebraic(f, r);
            const pos = algebraicToWorld(square);
            const mesh = createPieceMesh(piece.type, piece.color, style);
            mesh.position.set(pos.x, 0.08, pos.z);
            mesh.userData = { square, piece };
            piecesGroup.add(mesh);
          }
        }
      }
      updateHUDStatus();
    }

    /**************************************************************
     * 5. INTERACCIÓN TÁCTIL / DEDO (RAYCASTER) + TECLADO + IA
     **************************************************************/
    let selectedSquare = null;
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    function clearHighlights() {
      while (highlightsGroup.children.length > 0) highlightsGroup.remove(highlightsGroup.children[0]);
    }

    function showLegalMoves(square) {
      clearHighlights();
      const moves = game.moves({ square, verbose: true });
      moves.forEach(m => {
        const pos = algebraicToWorld(m.to);
        const ringGeo = new THREE.RingGeometry(0.25, 0.42, 24);
        ringGeo.rotateX(-Math.PI / 2);
        const ringMat = new THREE.MeshBasicMaterial({
          color: m.captured ? 0xef4444 : 0x10b981,
          side: THREE.DoubleSide
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.position.set(pos.x, 0.09, pos.z);
        highlightsGroup.add(ring);
      });
    }

    function tryMove(from, to) {
      const move = game.move({ from, to, promotion: 'q' });
      if (move) {
        selectedSquare = null;
        clearHighlights();
        renderPieces();

        // Si está en modo contra la Computadora (IA) y es turno de negras
        if (!game.game_over() && document.getElementById('game-mode').value === 'ai' && game.turn() === 'b') {
          setTimeout(makeAIMove, 450);
        }
        return true;
      }
      return false;
    }

    // IA con Evaluación Posicional y Niveles (Principiante a Gran Maestro)
    function makeAIMove() {
      const rankLevel = parseInt(document.getElementById('ai-rank').value, 10);
      const legalMoves = game.moves({ verbose: true });
      if (legalMoves.length === 0) return;

      const pieceValues = { p: 10, n: 30, b: 32, r: 50, q: 90, k: 900 };
      let chosenMove = legalMoves[0];

      if (rankLevel === 1) {
        // Principiante: Movimiento semialeatorio
        chosenMove = legalMoves[Math.floor(Math.random() * legalMoves.length)];
      } else {
        // Niveles Superiores: Búsqueda Minimax / Heurística de captura y control central
        let bestScore = -99999;
        legalMoves.forEach(m => {
          game.move(m);
          let score = 0;
          if (m.captured) score += pieceValues[m.captured] * 10;
          if (['d4', 'd5', 'e4', 'e5'].includes(m.to)) score += 15;
          if (game.in_check()) score += 25;

          // Mirar respuesta del oponente según nivel FIDE
          if (rankLevel >= 3) {
            const oppMoves = game.moves({ verbose: true });
            let maxOppCapture = 0;
            oppMoves.forEach(om => {
              if (om.captured) maxOppCapture = Math.max(maxOppCapture, pieceValues[om.captured] * 10);
            });
            score -= maxOppCapture;
          }
          // Ruido controlado según ELO
          score += (Math.random() - 0.5) * (25 / rankLevel);
          game.undo();

          if (score > bestScore) {
            bestScore = score;
            chosenMove = m;
          }
        });
      }

      game.move(chosenMove);
      renderPieces();
    }

    // Selección con el dedo o ratón en la cámara 3D/AR
    window.addEventListener('pointerdown', (e) => {
      if (e.target.tagName !== 'CANVAS') return;
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      // Verificar clic en piezas o casillas
      const intersects = raycaster.intersectObjects([...piecesGroup.children, ...boardGroup.children], true);
      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj.parent && !obj.userData.square) obj = obj.parent;
        const clickedSquare = obj.userData.square;
        if (!clickedSquare) return;

        if (selectedSquare) {
          if (!tryMove(selectedSquare, clickedSquare)) {
            // Si tocó otra pieza propia, cambiar selección
            const p = game.get(clickedSquare);
            if (p && p.color === game.turn()) {
              selectedSquare = clickedSquare;
              showLegalMoves(clickedSquare);
            } else {
              selectedSquare = null;
              clearHighlights();
            }
          }
        } else {
          const p = game.get(clickedSquare);
          if (p && p.color === game.turn()) {
            selectedSquare = clickedSquare;
            showLegalMoves(clickedSquare);
          }
        }
      }
    });

    // Movimiento por teclado (ej: "e2e4" o "Nf3")
    function handleKeyboardInput() {
      const input = document.getElementById('keyboard-move');
      const val = input.value.trim();
      if (!val) return;

      let moved = false;
      if (val.length === 4) {
        moved = tryMove(val.slice(0, 2).toLowerCase(), val.slice(2, 4).toLowerCase());
      }
      if (!moved) {
        // Intentar notación algebraica estándar (ej. Nf3, e4)
        const m = game.move(val);
        if (m) {
          renderPieces();
          if (!game.game_over() && document.getElementById('game-mode').value === 'ai' && game.turn() === 'b') {
            setTimeout(makeAIMove, 450);
          }
          moved = true;
        }
      }
      if (moved) input.value = '';
    }

    document.getElementById('btn-move-key').addEventListener('click', handleKeyboardInput);
    document.getElementById('keyboard-move').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleKeyboardInput();
    });

    /**************************************************************
     * 6. CONTROLES DE INTERFAZ Y CÁMARA AR
     **************************************************************/
    function updateHUDStatus() {
      const t = I18N[currentLang];
      let text = game.turn() === 'w' ? t.turnW : t.turnB;
      if (game.in_checkmate()) text = t.checkmate;
      else if (game.in_draw()) text = t.draw;
      else if (game.in_check()) text += t.check;
      document.getElementById('ui-status').textContent = text;
    }

    document.getElementById('lang-select').addEventListener('change', (e) => {
      currentLang = e.target.value;
      const t = I18N[currentLang];
      document.getElementById('ui-title').textContent = t.title;
      document.getElementById('lbl-mode').textContent = t.mode;
      document.getElementById('lbl-rank').textContent = t.rank;
      document.getElementById('lbl-biome').textContent = t.biome;
      document.getElementById('lbl-style').textContent = t.style;
      document.getElementById('lbl-colors').textContent = t.colors;
      document.getElementById('btn-reset').textContent = t.reset;
      document.getElementById('btn-toggle-ar').textContent = t.arBtn;
      document.getElementById('keyboard-move').placeholder = t.keyPlaceholder;
      document.getElementById('btn-move-key').textContent = t.moveBtn;
      updateHUDStatus();
    });

    document.getElementById('board-biome').addEventListener('change', (e) => buildBoard(e.target.value));
    document.getElementById('piece-style').addEventListener('change', () => renderPieces());
    document.getElementById('color-white').addEventListener('input', (e) => whiteMat.color.set(e.target.value));
    document.getElementById('color-black').addEventListener('input', (e) => blackMat.color.set(e.target.value));
    document.getElementById('btn-reset').addEventListener('click', () => {
      game.reset();
      selectedSquare = null;
      clearHighlights();
      renderPieces();
    });

    // Activar Cámara de Realidad Aumentada en Celular/PC
    let arActive = false;
    document.getElementById('btn-toggle-ar').addEventListener('click', async () => {
      const video = document.getElementById('ar-video');
      if (!arActive) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' }, audio: false
          });
          video.srcObject = stream;
          video.style.display = 'block';
          document.body.style.background = 'transparent';
          arActive = true;
        } catch (err) {
          alert('No se pudo acceder a la cámara AR. Verifica permisos HTTPS o navegador.');
        }
      } else {
        if (video.srcObject) video.srcObject.getTracks().forEach(tr => tr.stop());
        video.style.display = 'none';
        document.body.style.background = '#090d16';
        arActive = false;
      }
    });

    // Bucle de Animación (incluye viento en el pasto si está en Bioma Selva)
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      grassBlades.forEach(b => {
        b.rotation.z = Math.sin(elapsed * 2.5 + b.userData.phase) * 0.18;
      });
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Inicializar
    buildBoard('classic');
    renderPieces();
    animate();
  </script>
</body>
</html>
